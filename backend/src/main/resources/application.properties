# ===================================================
# APPLICATION PROPERTIES - GESTION RDV MÉDICAUX
# ===================================================

spring.application.name=gestion-rdv-backend
server.port=8080

# ---- Base de données H2 (développement) ----
spring.datasource.url=jdbc:h2:mem:gestionrdvdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- SQL Init ----
spring.sql.init.mode=never

# ---- JPA / Hibernate ----
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----
app.jwt.secret=GestionRDVMedicauxSecretKey2024VeryLongSecretKeyForJWTSigning
app.jwt.expiration=86400000

# ---- CORS ----
app.cors.allowed-origins=http://localhost:4200

# ---- Logging ----
logging.level.com.gestionrdv=DEBUG
logging.level.org.springframework.security=DEBUG
