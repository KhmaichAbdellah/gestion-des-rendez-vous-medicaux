version: '3.8'

services:
  # Base de données MySQL 8
  mysql-db:
    image: mysql:8.0
    container_name: gestion_rdv_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: gestion_rdv_db
      MYSQL_USER: rdv_user
      MYSQL_PASSWORD: rdv_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medical_network

  # Backend Spring Boot REST API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestion_rdv_backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/gestion_rdv_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: rdv_user
      SPRING_DATASOURCE_PASSWORD: rdv_password
      APP_JWT_SECRET: ProductionSecretKeyForGestionRdvMedicauxJWT2024SecureKey
      APP_JWT_EXPIRATION: 86400000
      APP_CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:4200
    ports:
      - "8080:8080"
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - medical_network

  # Frontend Angular (servi via Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gestion_rdv_frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - medical_network

volumes:
  mysql_data:
    driver: local

networks:
  medical_network:
    driver: bridge
